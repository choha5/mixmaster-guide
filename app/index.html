<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex, nofollow">
  <title>앱 배포 종료</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      background: #081426;
      color: #f3f6fb;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      text-align: center;
    }
    main { width: min(100%, 440px); }
    .mark {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      border-radius: 20px;
      background: #142844;
      color: #9fb3cc;
      font-size: 34px;
      font-weight: 800;
    }
    h1 { margin: 0 0 14px; font-size: 26px; }
    p { margin: 7px 0; color: #cbd6e5; font-size: 16px; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">×</div>
    <h1>앱 배포를 종료했습니다</h1>
    <p>이 앱은 더 이상 제공되지 않습니다.</p>
    <p>휴대폰에 설치된 앱을 삭제해 주세요.</p>
  </main>
</body>
</html>
